<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />

    <title>instaBrandz — Watch Shorts, Shop Sellers, Buy Fast</title>
    <meta name="description" content="instaBrandz is Egypt's multi-seller marketplace with short-video discovery. Watch shorts from real brands, hop into their storefront, and check out securely with Paymob and Fawry." />
    <meta name="keywords" content="marketplace, shorts, video shopping, online shopping, local brands, e-commerce, electronics, fashion, home goods, egypt, cairo, paymob, fawry" />
    <meta name="author" content="instaBrandz" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts — non-render-blocking -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" /></noscript>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dream-project-roan.vercel.app/" />
    <meta property="og:title" content="instaBrandz — Watch Shorts, Shop Sellers, Buy Fast" />
    <meta property="og:description" content="Watch short videos from real brands, then shop their storefronts with secure Paymob and Fawry checkout." />
    <meta property="og:image" content="https://dream-project-roan.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="instaBrandz" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://dream-project-roan.vercel.app/" />
    <meta name="twitter:title" content="instaBrandz — Watch Shorts, Shop Sellers, Buy Fast" />
    <meta name="twitter:description" content="Watch short videos from real brands, then shop their storefronts with secure Paymob and Fawry checkout." />
    <meta name="twitter:image" content="https://dream-project-roan.vercel.app/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://dream-project-roan.vercel.app/" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "instaBrandz",
      "url": "https://dream-project-roan.vercel.app/",
      "description": "Multi-seller marketplace with short-video discovery. Watch shorts from brands and shop their storefronts.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://dream-project-roan.vercel.app/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "instaBrandz",
      "url": "https://dream-project-roan.vercel.app/",
      "logo": "https://dream-project-roan.vercel.app/favicon.svg"
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
