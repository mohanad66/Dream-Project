<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />

    <title>DreamStore — Curated Marketplace for Premium & Local Brands</title>
    <meta name="description" content="DreamStore is a curated marketplace connecting discerning shoppers with premium local brands, artisans and independent creators in Egypt. Shop electronics, fashion, home goods and more with secure Paymob payments and Fawry." />
    <meta name="keywords" content="marketplace, premium brands, local artisans, curated shopping, e-commerce, electronics, fashion, home goods, egypt, cairo" />
    <meta name="author" content="DreamStore" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Fonts — preloaded for performance -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dream-project-roan.vercel.app/" />
    <meta property="og:title" content="DreamStore — Curated Marketplace for Premium & Local Brands" />
    <meta property="og:description" content="Discover a curated marketplace of premium local brands, artisans and independent creators in Egypt." />
    <meta property="og:image" content="https://dream-project-roan.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="DreamStore" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://dream-project-roan.vercel.app/" />
    <meta name="twitter:title" content="DreamStore — Curated Marketplace for Premium & Local Brands" />
    <meta name="twitter:description" content="Discover a curated marketplace of premium local brands, artisans and independent creators in Egypt." />
    <meta name="twitter:image" content="https://dream-project-roan.vercel.app/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://dream-project-roan.vercel.app/" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DreamStore",
      "url": "https://dream-project-roan.vercel.app/",
      "description": "Curated marketplace connecting discerning shoppers with premium local brands, artisans and independent creators in Egypt.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://dream-project-roan.vercel.app/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DreamStore",
      "url": "https://dream-project-roan.vercel.app/",
      "logo": "https://dream-project-roan.vercel.app/icon-512.png",
      "sameAs": []
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
