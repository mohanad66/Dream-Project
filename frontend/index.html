<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b0f17" />
    <title>DreamStore — Curated Marketplace for Premium & Local Brands</title>
    <meta
      name="description"
      content="DreamStore is a curated marketplace connecting discerning shoppers with premium local brands, artisans and independent creators. Shop electronics, fashion, home goods and more."
    />
    <meta
      name="keywords"
      content="marketplace, premium brands, local artisans, curated shopping, e-commerce, electronics, fashion, home goods"
    />
    <meta name="author" content="DreamStore" />
    <meta name="robots" content="index, follow" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dreamstore.com/" />
    <meta
      property="og:title"
      content="DreamStore — Curated Marketplace for Premium & Local Brands"
    />
    <meta
      property="og:description"
      content="Discover a curated marketplace of premium local brands, artisans and independent creators."
    />
    <meta property="og:image" content="https://dreamstore.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://dreamstore.com/" />
    <meta
      property="twitter:title"
      content="DreamStore — Curated Marketplace for Premium & Local Brands"
    />
    <meta
      property="twitter:description"
      content="Discover a curated marketplace of premium local brands, artisans and independent creators."
    />
    <meta
      property="twitter:image"
      content="https://dreamstore.com/og-image.jpg"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://dreamstore.com/" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
